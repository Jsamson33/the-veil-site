<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="text-scale" content="scale" />

		<!-- Color scheme + FOUC prevention (runs before first paint) -->
		<meta name="color-scheme" content="light dark" />
		<script>
			try {
				const savedTheme = localStorage.getItem('color-scheme');
				if (savedTheme) {
					document.querySelector('meta[name="color-scheme"]').content = savedTheme;
				}
			} catch (e) {}
		</script>

		<!-- Favicon -->
		<link rel="icon" type="image/png" href="%sveltekit.assets%/assets/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/assets/icons/icon-512.png" />

		<!-- Typography -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
			rel="stylesheet"
		/>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
